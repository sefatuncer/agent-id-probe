[package]
name = "bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["auth", "client"] }
reqwest = { version = "0.13.2", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
url = "2.4"

[profile.release]
debug = false
incremental = false
