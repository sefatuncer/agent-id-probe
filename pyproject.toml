[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-id-probe"
version = "0.1.0"
description = "Passive, spec-anchored measurement of identity and authorization metadata in deployed AI agent endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Sefa Tuncer" },
    { name = "Enis Karaarslan" },
]
keywords = ["agent identity", "A2A", "MCP", "OAuth", "did:web", "verifiable credentials", "measurement"]

# Upper bounds are deliberate. This package is a research artefact whose whole claim is
# that someone else can re-run it and get the same numbers; open-ended lower bounds make
# that claim expire silently on the next major release of anything. A clean container
# resolved `pandas>=2.2` to 3.0.5 and `ruff>=0.5` to 0.16 (which flagged seven new
# violations), which is the failure mode in miniature.
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "joserfc>=1.0,<2.0",
    # Not imported directly: joserfc pulls it in, and signature verification is on the
    # critical path, so the version is worth constraining rather than leaving to chance.
    "cryptography>=42.0,<47.0",
    "protego>=0.3,<1.0",
    # Was missing entirely until 2026-07-28. `collectors.py` imports it and `cli.py`
    # imports `collectors`, so `pip install .` succeeded and `--help` crashed. Invisible in
    # the authors' venv, fatal for every other reader; found by installing into a clean
    # container. pandas, matplotlib, tenacity and pyyaml were declared here and imported
    # nowhere, and were removed in the same pass -- `analysis.py` is standard-library only
    # on purpose.
    "tldextract>=5.1,<6.0",
]

[project.optional-dependencies]
# Rendering the paper's figures, and nothing else. matplotlib was removed from the core
# dependencies on 2026-07-28 because nothing imported it; `figures.py` now does, and it is
# an extra rather than a dependency so that the measurement instrument stays installable
# without a plotting stack. `agentidprobe.figures` imports matplotlib inside its render
# functions, so the package still imports cleanly when this extra is absent, and the CLI
# says which extra to install rather than raising ImportError at the reader.
figures = [
    "matplotlib>=3.8,<4.0",
]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-timeout>=2.3,<3.0",
    "respx>=0.21,<1.0",
    "ruff>=0.5,<0.17",
]

[project.urls]
Homepage = "https://github.com/sefatuncer/agent-id-probe"
Repository = "https://github.com/sefatuncer/agent-id-probe"
Issues = "https://github.com/sefatuncer/agent-id-probe/issues"
Ethics = "https://github.com/sefatuncer/agent-id-probe/blob/main/docs/ETHICS.md"

[project.scripts]
agent-id-probe = "agentidprobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentidprobe"]

# The opt-out list ships inside the wheel. Locating it only relative to the repository
# meant a `pip install` of this package found nothing and silently ran with an empty
# exclusion set -- the ethics gate of docs/ETHICS.md 7 disabled without a word. A packaged
# copy is a floor, not a substitute: it is the list as of this release, and `load_opt_out`
# still prefers AGENT_ID_PROBE_OPT_OUT and the working directory over it.
[tool.hatch.build.targets.wheel.force-include]
"docs/opt-out.txt" = "agentidprobe/opt-out.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The suite is fully mocked and must never touch the network. A per-test cap turns an
# accidental live call into a fast failure instead of a stalled run.
addopts = "--timeout=30 --timeout-method=thread"
# `c15-violating-rsa-key-below-2048-bits` deliberately carries a 1024-bit RSA key, so
# joserfc raises its own SecurityWarning when the key set is parsed. That warning is
# correct and is exactly what the fixture demonstrates; it is silenced here and asserted
# explicitly in `test_an_undersized_rsa_key_is_a_must_violation...` instead, because a
# warning nobody acts on trains everyone to ignore the warning output.
filterwarnings = [
    "ignore:Key size should be >= 2048 bits:UserWarning",
    "ignore:Key size should be >= 2048 bits",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
